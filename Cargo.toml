[package]
name = "hl-md-handler"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.4"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.6"
tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
config = "0.15.25"

[build-dependencies]
tonic-prost-build = "0.14.6"
